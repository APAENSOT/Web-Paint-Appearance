# Alembic configuration for the WaveScan platform backend.
#
# Bootstrapped by T01 (docs/tasks/T01-security-remediation.md step 1).
# T02 owns the full schema migration; T01 owns revision 0001 only.
#
# There is deliberately NO sqlalchemy.url here. The migrator connection
# string is read from the MIGRATOR_DATABASE_URL environment variable in
# migrations/env.py, because:
#
#   * migrator credentials must never live in a committed file
#     (docs/03-SECURITY.md section 3: "credentials never in the app .env"), and
#   * the application role must not be able to run DDL at all, so this
#     URL is a different principal from the one the API uses.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
