[project]
name = "paint-appearance-backend"
version = "0.1.0"
description = "WaveScan platform backend (FastAPI API + ingest worker)."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "security: T01 least-privilege / immutability guarantees",
    "schema: T02 target data model (docs/01-DATA-MODEL.md)",
    "contract: T03 API contract (docs/openapi.json)",
    "ingest: T04 ingest service (docs/02-PIPELINE.md)",
]
