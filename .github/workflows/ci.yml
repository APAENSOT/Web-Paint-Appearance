name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Types match docs/openapi.json
        run: pnpm types:generate && git diff --exit-code src/api/types.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - name: One migration head
        run: test "$(alembic heads | wc -l)" -eq 1
      - name: OpenAPI files match the code
        run: python scripts/emit_openapi.py && git diff --exit-code openapi.json ../docs/openapi.json
      # The database tests need a copy of the plant data, which CI does not
      # have; run them locally against a restored copy (README.md, "Run the tests").
      # The summary line reports them as "deselected".
      - name: Tests that need no database
        env:
          T01_DB: none
        run: python -m pytest tests -q -o addopts=""

  # The Cloud Run image, run the way Cloud Run runs it, against PostgreSQL.
  container:
    runs-on: ubuntu-24.04
    needs: [frontend, backend]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci-only-postgres
    steps:
      - uses: actions/checkout@v5
      - name: Build the Cloud Run image
        run: docker build --tag paint-appearance:ci .
      - name: Roles and database (infra/gcp/README.md, step 3)
        run: >-
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1
          -v migrator_password=ci-migrator -v app_rw_password=ci-app
          -f db/create_roles.sql
      - name: Migrate as migrator (the migrate job's command)
        # 0025 needs the restored plant data; an empty database stops at 0024.
        run: >-
          docker run --rm --network host
          -e MIGRATOR_DATABASE_URL=postgresql+psycopg://migrator:ci-migrator@127.0.0.1:5432/paint_appearance
          paint-appearance:ci alembic upgrade 0024
      - name: Start the service with the Cloud Run settings
        run: >-
          docker run -d --name app --network host -e PORT=8080
          -e AUTH_OPEN_ACCESS=true
          -e APP_DATABASE_URL=postgresql+psycopg://app_rw:ci-app@127.0.0.1:5432/paint_appearance
          paint-appearance:ci
      - name: Health, identity and the site answer
        run: |
          set -e
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health/ready && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/health/ready | grep -q '"ready"'
          curl -fsS http://127.0.0.1:8080/api/v1/auth/me | grep -q '"open-access"'
          curl -fsS http://127.0.0.1:8080/ | grep -qi '<div id="root"'
          curl -fsSI http://127.0.0.1:8080/ | grep -qi 'strict-transport-security'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/docs)" = 404
      - name: Logs
        if: failure()
        run: docker logs app
