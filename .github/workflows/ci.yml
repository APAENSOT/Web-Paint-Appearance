name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Types match docs/openapi.json
        run: pnpm types:generate && git diff --exit-code src/api/types.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - name: One migration head
        run: test "$(alembic heads | wc -l)" -eq 1
      - name: OpenAPI files match the code
        run: python scripts/emit_openapi.py && git diff --exit-code openapi.json ../docs/openapi.json
      # The database tests need a copy of the plant data, which CI does not
      # have; run them locally against a restored copy (README.md, "Run the tests").
      # The summary line reports them as "deselected".
      - name: Tests that need no database
        env:
          T01_DB: none
        run: python -m pytest tests -q -o addopts=""

  image:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the Cloud Run image
        run: docker build --tag paint-appearance:ci .
