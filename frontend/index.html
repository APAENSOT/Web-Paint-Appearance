<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Raw WaveScan measurements from the Paint Appearance API." />
    <title>Paint Appearance | WaveScan</title>

      try {
        document.documentElement.classList.toggle(
          "dark",
          localStorage.getItem("ct-theme") !== "light",
        );
      } catch {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
