# A local PostgreSQL for checking a release before it goes to Cloud Run
# (README.md, "Check a build locally"). Not used in production.
#
#   docker compose -f infra/docker-compose.yml up -d postgres
#
# Pin the major to the one Cloud SQL runs (docs/DEFERRED.md D6, still open);
# every migration has been run on 18. The port is bound to 127.0.0.1 because
# the database holds Ford plant quality data even locally.

name: paint-appearance-check

services:
  postgres:
    image: postgres:${POSTGRES_MAJOR:-18}-alpine
    container_name: paint-appearance-check-db
    environment:
      POSTGRES_USER: postgres
      # Local-only default; override in the shell or infra/.env (gitignored).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
    name: paint-appearance-check-pgdata
